<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workbench</title>
<link rel="stylesheet" href="/static/vendor/github-dark.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand"><span class="brand-dot"></span>Workbench</div>
    <div class="crumb" id="crumb"></div>
    <div class="top-actions">
      <button id="btn-theme" class="btn ghost icon-only" title="切换深浅色"></button>
      <button id="btn-view-edit" class="btn ghost" title="切换视图">分屏</button>
      <button id="btn-save" class="btn" title="保存 (Ctrl+S)"><span class="i" data-icon="save"></span>保存</button>
    </div>
  </header>

  <div id="main">
    <!-- 活动栏 -->
    <nav id="activitybar">
      <button class="act active" data-view="files" data-icon="folder" title="资源管理器"></button>
      <button class="act" data-view="git" data-icon="git" title="源代码管理">
        <span class="badge hidden" id="git-badge">0</span>
      </button>
      <button class="act" data-view="tools" data-icon="tools" title="工具箱"></button>
    </nav>

    <!-- 侧边栏 -->
    <aside id="sidebar">
      <!-- 文件视图 -->
      <div class="view" id="view-files">
        <div class="side-head">
          <span>资源管理器</span>
          <div class="head-actions">
            <button id="btn-new-file" class="icon-btn" data-icon="filePlus" title="新建文件（根目录）"></button>
            <button id="btn-new-dir" class="icon-btn" data-icon="folderPlus" title="新建文件夹（根目录）"></button>
            <button id="btn-refresh" class="icon-btn" data-icon="refresh" title="刷新"></button>
          </div>
        </div>
        <div id="tree"></div>
      </div>

      <!-- Git 视图 (源代码管理) -->
      <div class="view hidden" id="view-git">
        <div class="side-head">
          <span>源代码管理</span>
          <div class="head-actions">
            <button id="git-push" class="icon-btn" data-icon="upload" title="推送"></button>
            <button id="git-refresh" class="icon-btn" data-icon="refresh" title="刷新"></button>
          </div>
        </div>
        <div id="git-body">
          <div class="scm-input">
            <textarea id="git-msg" rows="1" placeholder="消息（Ctrl+Enter 提交）"></textarea>
          </div>
          <div class="scm-commit-row">
            <button class="scm-commit" id="git-commit">
              <span class="i" data-icon="check"></span>
              <span id="git-commit-label">提交</span>
            </button>
          </div>
          <div id="git-out" class="tool-out"></div>

          <div class="scm-section hidden" id="scm-staged">
            <div class="scm-section-head">
              <span class="scm-twist" data-icon="chevron"></span>
              <span class="scm-title">暂存的更改</span>
              <span class="scm-count" id="git-staged-count">0</span>
              <span class="scm-group-actions">
                <button class="scm-gact" data-act="unstage-all" title="取消全部暂存">−</button>
              </span>
            </div>
            <div id="git-staged" class="scm-list"></div>
          </div>

          <div class="scm-section" id="scm-changes">
            <div class="scm-section-head">
              <span class="scm-twist" data-icon="chevron"></span>
              <span class="scm-title">更改</span>
              <span class="scm-count hidden" id="git-changes-count">0</span>
              <span class="scm-group-actions">
                <button class="scm-gact" data-act="stage-all" title="暂存全部更改">+</button>
              </span>
            </div>
            <div id="git-files" class="scm-list"></div>
          </div>

          <div class="scm-section" id="scm-graph">
            <div class="scm-section-head">
              <span class="scm-twist" data-icon="chevron"></span>
              <span class="scm-title">图形</span>
              <span class="scm-head-extra">
                <select id="git-branch-sel" class="git-branch-sel" title="选择要查看的分支"></select>
              </span>
            </div>
            <div id="git-log" class="scm-list git-graph"></div>
          </div>
        </div>
      </div>

      <!-- 工具视图 -->
      <div class="view hidden" id="view-tools">
        <div class="side-head"><span>工具箱</span></div>
        <div class="tool-tabs" id="tool-tabs"></div>
        <div id="tool-body"></div>
      </div>
    </aside>

    <!-- 侧栏宽度拖动条 -->
    <div id="sidebar-resizer" title="拖动调节侧栏宽度"></div>

    <!-- 中：编辑 / 预览 / diff -->
    <section id="content">
      <div id="welcome" class="welcome">
        <div class="welcome-logo" data-icon="tools"></div>
        <h1>Workbench</h1>
        <p class="lead">轻量本地工作台</p>
        <div class="welcome-hints">
          <div class="hint"><span class="hint-i" data-icon="folder"></span>选文件编辑，Markdown 实时预览</div>
          <div class="hint"><span class="hint-i" data-icon="git"></span>查看 Git 改动、提交推送</div>
          <div class="hint"><span class="hint-i" data-icon="tools"></span>JSON / Base64 / 时间戳 等小工具</div>
        </div>
        <p class="muted kbd-tip"><kbd>Ctrl</kbd>+<kbd>S</kbd> 保存　·　<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 提交</p>
      </div>
      <div id="editor-wrap" class="hidden">
        <textarea id="editor" spellcheck="false" placeholder="内容…"></textarea>
        <div id="preview" class="markdown-body"></div>
      </div>
      <div id="diff-view" class="hidden">
        <div class="diff-head" id="diff-head"></div>
        <pre id="diff-body" class="git-diff"></pre>
      </div>
      <div id="image-view" class="hidden"><img id="image-el" alt=""></div>
      <div id="binary-view" class="hidden">
        <div class="bin-icon" data-icon="file"></div>
        <p>二进制文件，无法编辑</p>
        <p class="muted" id="binary-info"></p>
      </div>
    </section>
  </div>

  <footer id="statusbar">
    <span id="status-file">未打开文件</span>
    <span id="status-branch" class="muted"></span>
    <span id="status-msg"></span>
  </footer>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/tools.js"></script>
<script src="/static/git.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
